<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Blog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>

        <h2>BlogPulse</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="add-blog.html">Add Blog</a>
        </div>

    </nav>

    <div class="container">

        <h1>Add New Blog</h1>

        <form>

            <label>Title</label>
            <input type="text" placeholder="Enter Blog Title">

            <label>Author</label>
            <input type="text" placeholder="Author Name">

            <label>Description</label>

            <textarea rows="8" placeholder="Write your blog..."></textarea>

            <button type="submit">
                Publish Blog
            </button>

        </form>

    </div>

    <footer>
        © 2026 BlogPulse
    </footer>

</body>
